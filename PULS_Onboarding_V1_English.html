/* A single, centred onboarding surface. */
header{height:64px;justify-content:center;background:transparent;border:0;padding:0 24px}
.header-right{gap:14px}.shell{display:block;max-width:1000px;min-height:calc(100dvh - 64px)}
main{min-height:calc(100dvh - 64px);padding:22px 48px 20px}
.topline{justify-content:center;margin-bottom:18px}.progress{max-width:800px;margin:0 auto 38px}
#screen{display:flex;align-items:center;justify-content:center}.question{width:100%}
.question>.eyebrow,.question>h1,.question>p.lead{text-align:center;margin-left:auto;margin-right:auto}
.welcome{display:flex;justify-content:center;min-height:450px;text-align:center}.welcome>div{max-width:600px;width:100%}
.welcome h1{margin-left:auto;margin-right:auto}.welcome .lead{max-width:460px;margin-left:auto;margin-right:auto}
.mini-features{justify-content:center}.auth-buttons{margin-left:auto;margin-right:auto;max-width:340px}
.nav{width:100%}.footer{max-width:800px;width:100%;margin-left:auto;margin-right:auto}
@media(max-width:760px){main{padding:18px 20px 20px}.welcome{min-height:unset;padding:28px 0}.welcome h1{font-size:40px}.progress{margin-bottom:27px}.header-right{gap:10px}}

<body>
<header><div class="header-right"><span class="prototype">INTERACTIVE PROTOTYPE</span><span class="language">EN</span></div></header>
<div class="shell"><main><div class="topline"><span id="step-label">ABOUT 4 MINUTES</span></div><div class="progress" role="progressbar" aria-label="Onboarding progress" aria-valuemin="0" aria-valuemax="7" aria-valuenow="0"><span id="progress-fill"></span></div><div id="screen"></div><div id="navigation"></div><footer class="footer"><span>Illustrative experience. No live banking connection.</span><button class="text-btn" onclick="askEnd()">Reset prototype</button></footer></main></div><div id="overlay"></div><div id="announcer" aria-live="polite" class="hint" style="position:absolute;left:-10000px"></div>
<script>
'use strict';
const labels=['Your life right now','What matters to you','Your monthly picture','Your safety net','Your saving rhythm','Looking ahead','How you feel'];
const lifeOptions=[['education','◎','Studying or training'],['career','↗','Working or starting out'],['home','⌂','Moving or buying a home'],['family','♡','Growing a family'],['business','◇','Running a business'],['change','⌁','A new chapter']];
const goalOptions=[['buffer','◉','Build a safety net'],['travel','↗','Travel or take a break'],['home','⌂','Move or buy a home'],['wealth','◇','Build long-term wealth'],['family','♡','Plan for my family'],['explore','◎','Find my direction']];
const savingOptions=[['regular','Every month','A regular amount, usually on autopilot.',[22,22,22,22,22,22]],['leftover','When there is money left','The amount changes from month to month.',[9,26,13,20,6,30]],['notyet','Not at the moment','Saving is not part of my routine right now.',[3,3,3,3,3,3]],['variable','It depends','My income or circumstances vary.',[26,5,18,30,8,18]]];
const protectionOptions=[['retirement','◎','Retirement planning','Pensions or other plans for later life.'],['income','↗','Income protection','A plan if you are unable to work.'],['family','♡','Family & important documents','Protection for dependants and wishes recorded.']];
const fresh=()=>({stage:'welcome',step:0,method:null,sample:false,life:[],goal:null,months:12,allocation:[50,25,15,10],reserve:3,saving:null,protection:{retirement:null,income:null,family:null},mood:2,answered:{},activated:false,editing:false});
let state=fresh();
try{const raw=sessionStorage.getItem('puls-onboarding-v1');if(raw){const saved=JSON.parse(raw);if(saved.version===1&&Date.now()-saved.savedAt<300000)state={...fresh(),...saved.state};}}catch{}
let lastActivity=Date.now();let toastTimer;let idleWarning=false;
const $=id=>document.getElementById(id);
const save=()=>{try{sessionStorage.setItem('puls-onboarding-v1',JSON.stringify({version:1,savedAt:Date.now(),state}));}catch{}};
const escapeHTML=v=>String(v).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const selected=(yes)=>yes?' selected':'';
const goalName=()=>goalOptions.find(x=>x[0]===state.goal)?.[2]||'A direction to explore';
const monthDate=()=>{const d=new Date();d.setDate(1);d.setMonth(d.getMonth()+state.months);return d.toLocaleDateString('en-GB',{month:'short',year:'numeric'});};
function toast(t){$('announcer').textContent=t;document.querySelector('.notice')?.remove();const el=document.createElement('div');el.className='notice';el.textContent=t;document.body.append(el);clearTimeout(toastTimer);toastTimer=setTimeout(()=>el.remove(),2200);}
function start(method){state.method=method;state.stage='consent';save();render();}
function startQuestions(){state.sample=$('sample-consent').checked;state.stage='questions';state.step=0;save();render();}
function render(){
 const current=state.stage==='questions'?state.step:-1;
 const completed=state.stage==='review'||state.activated?7:state.stage==='questions'?state.step:0;
 $('progress-fill').style.width=(completed/7*100)+'%';document.querySelector('[role="progressbar"]').setAttribute('aria-valuenow',completed);
 $('step-label').textContent=state.stage==='questions'?`QUESTION ${state.step+1} OF 7`:state.stage==='review'?'YOUR PERSONAL STARTING POINT':state.activated?'WIDGET ACTIVATED · DEMO':'ABOUT 4 MINUTES';
 let html='';
 if(state.stage==='welcome')html=welcome();
 else if(state.stage==='consent')html=consent();
 else if(state.stage==='questions')html=question();
 else if(state.stage==='review')html=review();
 else html=activated();
 $('screen').innerHTML=html;
 $('navigation').innerHTML=navigation();
 if(state.stage==='questions'&&state.step===2){drawDonut();setupDonut();}
 bindDrop();
 document.querySelector('h1')?.setAttribute('tabindex','-1');document.querySelector('h1')?.focus({preventScroll:true});window.scrollTo(0,0);
}
function welcome(){return `<div class="question welcome"><div><p class="eyebrow">YOUR FINANCIAL CHECK-IN</p><h1>Your life.<br>Your plans.<br>Let’s connect the dots.</h1><p class="lead">A few small interactions. A clearer picture of where you are — and what could come next.</p><div class="mini-features"><span>◷ About 4 minutes</span><span>◇ Made around you</span></div><div class="auth-buttons"><button class="primary" onclick="start('card')">Insert your card <span>→</span></button><button class="secondary" onclick="start('nfc')">Tap your card with NFC &nbsp; ◉</button></div><p class="hint">Demo: both buttons simulate an authenticated card session.<br>No card, PIN or personal banking details are collected.</p></div></div>`;}
function consent(){return `<section class="question"><p class="eyebrow">A STARTING POINT YOU CONTROL</p><h1>Shall we start with<br>a little context?</h1><p class="lead">You’re signed in for this simulated ${state.method==='nfc'?'NFC':'card'} session. Choose how you would like to begin.</p><div class="card-list"><div class="choice"><span class="icon">◇</span><div><strong>Your answers shape your experience</strong><small>Life moments, everyday habits and your own priorities.</small></div></div><div class="choice"><span class="icon">▣</span><div><strong>You decide what to share</strong><small>Skip any question. Review and change your answers before activation.</small></div></div></div><div class="consent-box"><label><input id="sample-consent" type="checkbox" ${state.sample?'checked':''}><span>Start my monthly picture with an illustrative spending split.<br><span class="hint">Optional demo data only. No account data is accessed. Without this option, you build your own split.</span></span></label></div><div class="inline-note">Your answers stay in this browser tab for this prototype session. Ending the session or five minutes of inactivity clears them.</div></section>`;}
function question(){
 const intro=(eyebrow,title,lead)=>`<section class="question"><p class="eyebrow">${eyebrow}</p><h1>${title}</h1><p class="lead">${lead}</p>`;
 if(state.step===0)return intro('01 · YOUR LIFE RIGHT NOW','What’s happening in your life?','Choose the moments that feel relevant. Tap a card or drag it into your circle. You can choose more than one.')+`<div class="life-layout"><div class="life-grid">${lifeOptions.map(([id,icon,name])=>`<button draggable="true" data-life="${id}" class="choice${selected(state.life.includes(id))}" aria-pressed="${state.life.includes(id)}" onclick="toggleLife('${id}')"><span class="icon">${icon}</span><strong>${name}</strong><span class="check">${state.life.includes(id)?'✓':''}</span></button>`).join('')}</div><div class="drop-zone" id="life-drop"><p class="eyebrow">YOUR WORLD</p><b>${state.life.length?'A picture that’s<br>uniquely yours.':'Your next chapter<br>starts here.'}</b><div class="life-tags">${state.life.map(id=>`<span class="tag">${lifeOptions.find(x=>x[0]===id)[2]}</span>`).join('')}</div><span class="hint">${state.life.length?`${state.life.length} moment${state.life.length>1?'s':''} selected`:'Drop a moment here, or tap a card.'}</span></div></div></section>`;
 if(state.step===1)return intro('02 · WHAT MATTERS TO YOU','What would you like to move towards?','Pick one priority for now. You can change it later as life changes.')+`<div class="goal-grid">${goalOptions.map(([id,icon,name])=>`<button class="choice${selected(state.goal===id)}" aria-pressed="${state.goal===id}" onclick="setGoal('${id}')"><span class="icon">${icon}</span><strong>${name}</strong></button>`).join('')}</div><div class="panel"><div class="range-label"><span>Your preferred time horizon</span><strong id="goal-date">${monthDate()}</strong></div><svg class="journey-line" viewBox="0 0 600 80" preserveAspectRatio="none" aria-hidden="true"><defs><linearGradient id="journey-fill"><stop stop-color="#bcd7fa"/><stop offset="1" stop-color="#0067d9"/></linearGradient></defs><path d="M12 66C170 66 280 12 588 12" fill="none" stroke="#e6edf6" stroke-width="3"/><path id="goal-curve" d="M12 66C170 66 280 12 588 12" fill="none" stroke="url(#journey-fill)" stroke-width="3"/><circle cx="12" cy="66" r="6" fill="#001b44"/><circle cx="588" cy="12" r="7" fill="#0067d9"/></svg><input class="range" aria-label="Months until your goal" type="range" min="1" max="60" value="${state.months}" oninput="setMonths(this.value)"><div class="range-ends"><span>1 month</span><span>5 years</span></div><p class="goal-caption"><strong id="goal-name">${goalName()}</strong><br><span id="goal-months">${state.months}</span> months to make room for what matters.</p></div></section>`;
 if(state.step===2)return intro('03 · YOUR MONTHLY PICTURE','Where does your money go?','Shape a typical month. Drag the white handles on the chart, or move the sliders. An estimate is enough.')+`<div class="panel"><div class="split"><div class="donut-wrap"><svg id="donut" viewBox="0 0 300 300" role="img" aria-label="Monthly allocation chart"></svg><div class="donut-center"><b>100<span style="font-size:19px">%</span></b><span>YOUR MONTH</span></div></div><div class="allocation">${['Essentials','Everyday living','Enjoying life','Saving & investing'].map((name,i)=>`<label><div class="range-label"><span><i class="swatch" style="background:${['#001b44','#0067d9','#71a6e8','#91d1c4'][i]}"></i>${name}</span><strong id="allocation-value-${i}">${state.allocation[i]}%</strong></div><input id="allocation-${i}" class="range" aria-label="${name} percentage" type="range" min="0" max="100" value="${state.allocation[i]}" oninput="updateAllocation(${i},this.value)"></label>`).join('')}</div></div><div class="sample-note">${state.sample?'You started with an illustrative split. Adjust it to reflect your situation.':'The initial split is only a starting illustration. Adjust it to reflect your month, or skip this question.'} Moving one slider proportionally adjusts the other categories so the total stays at 100%.</div></div></section>`;
 if(state.step===3)return intro('04 · YOUR SAFETY NET','How much breathing room do you have?','If your income stopped, how long could your accessible savings cover essential expenses? Use your best estimate.')+`<div class="panel"><div class="big-metric" id="reserve-number">${state.reserve===12?'12+':state.reserve}</div><div class="metric-caption">months of essential expenses</div><div class="reserve-stage" id="reserve-bars" aria-hidden="true">${Array.from({length:12},(_,i)=>`<span class="${i<state.reserve?'full':''}"></span>`).join('')}</div><input class="range" type="range" aria-label="Months of essential expenses covered by savings" min="0" max="12" value="${state.reserve}" oninput="setReserve(this.value)"><div class="range-ends"><span>No buffer yet</span><span>A year or more</span></div><div class="inline-note" id="reserve-note">${reserveNote()}</div></div></section>`;
 if(state.step===4)return intro('05 · YOUR SAVING RHYTHM','What does saving look like for you?','Choose the pattern closest to your everyday life. There is no judgement here.')+`<div class="savings-grid">${savingOptions.map(([id,name,sub,pattern])=>`<button class="choice${selected(state.saving===id)}" aria-pressed="${state.saving===id}" onclick="setSaving('${id}')"><div><strong>${name}</strong><small>${sub}</small><div class="pattern" aria-hidden="true">${pattern.map(h=>`<i style="height:${h}px"></i>`).join('')}</div></div><span class="check">${state.saving===id?'✓':''}</span></button>`).join('')}</div><p class="hint" style="margin-top:18px">Your current rhythm helps us suggest a manageable next step.</p></section>`;
 if(state.step===5){const items=state.life.includes('family')||state.goal==='family'?protectionOptions:[...protectionOptions.slice(0,2),['documents','▤','Important documents','Recorded wishes and someone you trust to help.']];return intro('06 · LOOKING AHEAD','What have you already put in place?','A first overview is enough. “Not sure” is a useful answer — we can help you explore it later.')+`<div class="protection">${items.map(([id,icon,name,sub])=>`<div class="protect-row"><span class="icon">${icon}</span><div><strong>${name}</strong><small>${sub}</small></div><div class="segments" role="group" aria-label="${name}">${[['yes','In place'],['unsure','Not sure'],['no','Not yet']].map(([v,l])=>`<button class="${state.protection[id]===v?'selected':''}" aria-pressed="${state.protection[id]===v}" onclick="setProtection('${id}','${v}')">${l}</button>`).join('')}</div></div>`).join('')}</div><p class="hint" style="margin-top:18px">“In place” records your answer. It does not verify whether a policy or plan covers your needs.</p></section>`;}
 return intro('07 · HOW YOU FEEL','And how does it all feel to you?','Your numbers tell part of the story. How you feel about your finances matters too.')+`<div class="panel"><div class="mood-orb" id="mood-orb"><div class="face" aria-hidden="true"><div class="eyes"><i></i><i></i></div><div class="mouth" id="mouth" style="${mouthStyle()}"></div></div></div><div class="mood-word" id="mood-word">${moodName()}</div><input class="range" type="range" min="0" max="4" value="${state.mood}" aria-label="How you feel about your finances" aria-valuetext="${moodName()}" oninput="setMood(this)"><div class="range-ends"><span>Under pressure</span><span>At ease</span></div><div class="inline-note">This answer helps tailor the tone and support to you. It is not a test and does not lower your financial score.</div></div></section>`;
}
function answerValues(){return [state.life.length?state.life.map(id=>lifeOptions.find(x=>x[0]===id)[2]).join(', '):'Not specified',state.goal?`${goalName()} · ${state.months} months`:'Not specified',state.allocation.map((v,i)=>`${['Essentials','Everyday','Enjoyment','Saving'][i]} ${v}%`).join(' · '),`${state.reserve===12?'12+':state.reserve} months of essential expenses`,savingOptions.find(x=>x[0]===state.saving)?.[1]||'Not specified',Object.entries(state.protection).filter(([k,v])=>v&&activeProtectionKeys().includes(k)).map(([k,v])=>`${({retirement:'Retirement',income:'Income protection',family:'Family & documents',documents:'Documents'})[k]}: ${({yes:'in place',unsure:'not sure',no:'not yet'})[v]}`).join(' · ')||'Not specified',moodName()];}
function activeProtectionKeys(){return ['retirement','income',state.life.includes('family')||state.goal==='family'?'family':'documents'];}
function review(){return `<section class="question"><p class="eyebrow">YOUR PICTURE, IN YOUR WORDS</p><h1>Does this feel like you?</h1><p class="lead">Here is the starting point you have shaped. Change anything before you confirm and unlock your widget.</p><div class="summary">${answerValues().map((v,i)=>`<div class="summary-item"><div><div class="label">${labels[i]}</div><div class="value">${state.answered[i]?escapeHTML(v):'Not shared yet'}</div></div><button class="edit" onclick="edit(${i})" aria-label="Edit ${labels[i].toLowerCase()}">Edit ↗</button></div>`).join('')}</div><div class="consent-box"><label><input id="confirm-profile" type="checkbox" onchange="document.getElementById('activate').disabled=!this.checked"><span>I confirm this starting profile and want to activate my widget in this prototype.<br><span class="hint">Your answers will be used for the demo widget. You can change them later.</span></span></label></div><p class="hint">This is a self-reported starting profile. We need more information before showing a reliable financial health score.</p></section>`;}
function nextStep(){if(state.answered[3]&&state.reserve<2)return ['Make room for a small safety net','Explore an affordable first buffer, based on your essential expenses.'];if(state.answered[1]&&state.goal)return ['Turn your priority into a plan',`Start with “${goalName()}” and explore the next ${state.months} months.`];if(state.answered[4]&&state.saving==='notyet')return ['Find your own saving rhythm','Explore whether a small regular amount fits your everyday life.'];return ['Build a little more clarity','Add the details you skipped, at a pace that feels right for you.'];}
function activated(){const [title,sub]=nextStep();return `<section class="question activation"><div><div class="success-badge">✓</div><p class="eyebrow">CHECK-IN COMPLETE</p><h1>Your next chapter.<br>Ready when you are.</h1><p class="lead">Your widget and app integration are now unlocked in this demo. Your confirmed answers carry into your personal starting profile.</p><div class="profile-next"><p class="eyebrow">YOUR FIRST STEP</p><p><strong>${escapeHTML(title)}</strong><br>${escapeHTML(sub)}</p></div><button class="primary" onclick="openProfile()">View my starting profile <span>→</span></button><p class="hint">Prototype activation only. No real bank account, app or service has been changed.</p></div><div class="phone" aria-label="Unlocked demo banking app preview"><div class="phone-head"><span>9:41</span><span>•••</span></div><h3>Your banking</h3><div class="account">Current account · demo<b>€2,450.00</b></div><div class="widget"><small>YOUR FINANCIAL WELLBEING</small><h4>A clearer starting point.</h4><p>${state.answered[1]&&state.goal?escapeHTML(goalName()):'Your life. Your next chapter.'}</p><svg class="pulse-icon" viewBox="0 0 180 45" fill="none" aria-hidden="true"><path d="M0 24H39L53 24L66 8L80 39L97 14L111 24H180" stroke="#83b9ff" stroke-width="2"/></svg><p style="font-size:9px">Starting profile · Score not yet available</p></div><div class="phone-tab"><span>Overview</span><span>Payments</span><span>Profile</span></div></div></section>`;}
function navigation(){if(state.stage==='welcome'||state.stage==='activated')return '';if(state.stage==='consent')return `<nav class="nav" aria-label="Onboarding navigation"><button class="back" onclick="back()">← Back</button><button class="primary" onclick="startQuestions()">Let’s begin <span>→</span></button></nav>`;if(state.stage==='review')return `<nav class="nav" aria-label="Onboarding navigation"><button class="back" onclick="edit(6)">← Back</button><button class="primary" id="activate" disabled onclick="activate()">Confirm & unlock my widget <span>→</span></button></nav>`;return `<nav class="nav" aria-label="Onboarding navigation"><button class="back" onclick="back()">← Back</button><div class="nav-right"><button class="text-btn" onclick="advance(true)">Skip for now</button><button class="primary" id="continue" ${validAnswer()?'':'disabled'} onclick="advance(false)">${state.editing?'Save changes':state.step===6?'Review my picture':'Continue'} <span>→</span></button></div></nav>`;}
function validAnswer(){if(state.step===0)return state.life.length>0;if(state.step===1)return !!state.goal;if(state.step===4)return !!state.saving;if(state.step===5)return activeProtectionKeys().every(k=>!!state.protection[k]);return true;}
function advance(skip){if(!skip&&!validAnswer())return;state.answered[state.step]=!skip;if(state.editing){state.stage='review';state.editing=false;}else if(state.step===6)state.stage='review';else state.step++;save();render();}
function back(){if(state.stage==='consent'){state.stage='welcome';}else if(state.editing){state.stage='review';state.editing=false;}else if(state.step===0)state.stage='consent';else state.step--;save();render();}
function edit(i){state.stage='questions';state.step=i;state.editing=true;save();render();}
function activate(){if(!$('confirm-profile')?.checked)return;state.activated=true;state.stage='activated';state.editing=false;save();render();}
function toggleLife(id){state.life=state.life.includes(id)?state.life.filter(x=>x!==id):[...state.life,id];save();render();}
function setGoal(id){state.goal=id;save();render();}
function setMonths(v){state.months=+v;$('goal-date').textContent=monthDate();$('goal-months').textContent=v;save();}
function setSaving(id){state.saving=id;save();render();}
function setProtection(id,v){state.protection[id]=v;save();render();}
function reserveNote(){return state.reserve===0?'Thanks for sharing. We can start by exploring a manageable first buffer.':state.reserve<3?'You have some breathing room. We can help you explore what level of buffer fits your circumstances.':'This records your estimate. Your essential costs and access to savings will help refine the picture later.';}
function setReserve(v){state.reserve=+v;$('reserve-number').textContent=+v===12?'12+':v;$('reserve-note').textContent=reserveNote();$('reserve-bars').innerHTML=Array.from({length:12},(_,i)=>`<span class="${i<+v?'full':''}"></span>`).join('');save();}
function moodName(){return ['Under pressure','A little worried','Somewhere in between','Mostly comfortable','At ease'][state.mood];}
function mouthStyle(){return state.mood<2?'transform:rotate(180deg);':state.mood===2?'border-radius:0;height:0;margin-top:22px;':'';}
function setMood(el){state.mood=+el.value;el.setAttribute('aria-valuetext',moodName());$('mood-word').textContent=moodName();$('mouth').style.cssText=mouthStyle();$('mood-orb').style.background=`radial-gradient(circle at 35% 25%,#fff,${['#d3d9e6','#d1deef','#c9ddf8','#c4e4e2','#bce4d9'][state.mood]})`;save();}
function updateAllocation(i,value){const v=+value;const remaining=100-v;const others=state.allocation.reduce((sum,n,j)=>j===i?sum:sum+n,0);let total=0;const keys=[0,1,2,3].filter(j=>j!==i);keys.forEach((j,k)=>{const n=k===keys.length-1?remaining-total:Math.floor(remaining*(others?state.allocation[j]/others:1/3));state.allocation[j]=n;total+=n;});state.allocation[i]=v;refreshAllocation();}
function refreshAllocation(){for(let j=0;j<4;j++){$('allocation-'+j).value=state.allocation[j];$('allocation-value-'+j).textContent=state.allocation[j]+'%';}drawDonut();save();}
function point(a,r=108){return [150+r*Math.cos(a*Math.PI/180),150+r*Math.sin(a*Math.PI/180)];}
function drawDonut(){const colors=['#001b44','#0067d9','#71a6e8','#91d1c4'];let offset=0;let html='<circle cx="150" cy="150" r="108" fill="none" stroke="#e9eff7" stroke-width="36"/>';
 state.allocation.forEach((n,i)=>{const circ=2*Math.PI*108;html+=`<circle cx="150" cy="150" r="108" fill="none" stroke="${colors[i]}" stroke-width="36" stroke-dasharray="${n/100*circ} ${circ}" stroke-dashoffset="${-offset/100*circ}" transform="rotate(-90 150 150)"/>`;offset+=n;});
 offset=0;state.allocation.slice(0,3).forEach((n,i)=>{offset+=n;const [x,y]=point(offset*3.6-90);html+=`<circle data-boundary="${i}" cx="${x}" cy="${y}" r="8" fill="white" stroke="#446990" stroke-width="2" style="cursor:grab"/>`;});$('donut').innerHTML=html;$('donut').setAttribute('aria-label','Monthly allocation: '+state.allocation.map((n,i)=>['Essentials','Everyday living','Enjoying life','Saving and investing'][i]+' '+n+'%').join(', '));}
function setupDonut(){const svg=$('donut');let index=null;let dragPointer=null;svg.addEventListener('pointerdown',e=>{const circle=e.target.closest('[data-boundary]');if(!circle)return;index=+circle.dataset.boundary;dragPointer=e.pointerId;svg.setPointerCapture(e.pointerId);e.preventDefault();});svg.addEventListener('pointermove',e=>{if(index===null)return;const r=svg.getBoundingClientRect();const x=(e.clientX-r.left)/r.width*300-150;const y=(e.clientY-r.top)/r.height*300-150;let fraction=(Math.atan2(y,x)*180/Math.PI+90+360)%360/3.6;const before=state.allocation.slice(0,index).reduce((a,b)=>a+b,0);const pair=state.allocation[index]+state.allocation[index+1];fraction=Math.max(before,Math.min(before+pair,Math.round(fraction)));state.allocation[index]=fraction-before;state.allocation[index+1]=pair-state.allocation[index];refreshAllocation();});const release=()=>{index=null;if(dragPointer!==null&&svg.hasPointerCapture(dragPointer))svg.releasePointerCapture(dragPointer);dragPointer=null;};svg.addEventListener('pointerup',release);svg.addEventListener('pointercancel',release);}
function bindDrop(){document.querySelectorAll('[data-life]').forEach(el=>el.addEventListener('dragstart',e=>e.dataTransfer.setData('text/plain',el.dataset.life)));const zone=$('life-drop');if(!zone)return;zone.addEventListener('dragover',e=>{e.preventDefault();zone.classList.add('over');});zone.addEventListener('dragleave',()=>zone.classList.remove('over'));zone.addEventListener('drop',e=>{e.preventDefault();const id=e.dataTransfer.getData('text/plain');if(lifeOptions.some(x=>x[0]===id)&&!state.life.includes(id)){state.life.push(id);save();render();toast('Added to your world');}else zone.classList.remove('over');});}
function openProfile(){const vals=answerValues();$('overlay').innerHTML=`<div class="modal-backdrop"><div class="modal" role="dialog" aria-modal="true" aria-labelledby="profile-title"><p class="eyebrow">YOUR STARTING PROFILE</p><h2 id="profile-title">A starting point to build on.</h2><p>${Object.values(state.answered).filter(Boolean).length} of 7 topics shared. Your answers are self-reported; financial knowledge and learning progress have not yet been assessed.</p><p>${state.answered[1]?escapeHTML(vals[1]):'Your next priority is still open.'}</p><div class="modal-actions"><button class="primary" onclick="closeModal()">Back to my overview</button><button class="secondary" onclick="closeModal();state.stage='review';state.activated=false;save();render()">Update my answers</button></div></div></div>`;focusModal();}
function focusModal(){$('overlay').querySelector('button')?.focus();}
function closeModal(){$('overlay').innerHTML='';idleWarning=false;lastActivity=Date.now();}
function askEnd(){idleWarning=false;$('overlay').innerHTML=`<div class="modal-backdrop"><div class="modal" role="dialog" aria-modal="true" aria-labelledby="end-title"><p class="eyebrow">YOUR SESSION</p><h2 id="end-title">End this check-in?</h2><p>This clears your answers and returns the terminal to its welcome screen.</p><div class="modal-actions"><button class="primary" onclick="resetSession()">End & clear answers</button><button class="secondary" onclick="closeModal()">Keep going</button></div></div></div>`;focusModal();}
function resetSession(){try{sessionStorage.removeItem('puls-onboarding-v1');}catch{}state=fresh();closeModal();render();toast('Session cleared');}
['pointerdown','keydown','input'].forEach(type=>document.addEventListener(type,()=>{lastActivity=Date.now();save();}));
setInterval(()=>{if(state.stage==='welcome')return;const elapsed=Date.now()-lastActivity;if(elapsed>=300000){resetSession();return;}if(elapsed>=270000&&!idleWarning){idleWarning=true;$('overlay').innerHTML=`<div class="modal-backdrop"><div class="modal" role="dialog" aria-modal="true" aria-labelledby="idle-title"><h2 id="idle-title">Still with us?</h2><p>This session will clear after five minutes of inactivity. Tap below to keep going.</p><button class="primary" onclick="closeModal()">Continue my check-in</button></div></div>`;focusModal();}},5000);
document.addEventListener('keydown',e=>{const modal=$('overlay').querySelector('[role="dialog"]');if(!modal)return;if(e.key==='Escape'){closeModal();return;}if(e.key==='Tab'){const els=[...modal.querySelectorAll('button')];const first=els[0],last=els.at(-1);if(e.shiftKey&&document.activeElement===first){e.preventDefault();last.focus();}else if(!e.shiftKey&&document.activeElement===last){e.preventDefault();first.focus();}}});
render();
</script>
</body>
</html>
