/* PULS v7: seamless fixed score + composer; horizontal fragmentation; ascending journey */
:root{--navy:#072d67;--blue:#0756bc;--ink:#112a4e;--teal:#2364af}
.puls-header{height:58px;flex:0 0 58px;background:var(--navy);color:#fff;border:0;padding:0 18px}
.puls-header strong{font-size:13px;font-weight:750;letter-spacing:.005em}
.puls-header .back,.puls-header .xbtn{color:#fff}
.puls-header .xbtn{width:31px;height:31px;border:1px solid #ffffff50;border-radius:10px;font-size:18px;display:grid;place-items:center}
.puls-experience{flex:1;min-height:0;display:flex;flex-direction:column;background:#fff;overflow:hidden}
/* No border: the pinned score fades into the content scrolling behind it. */
.sticky-score{position:relative;z-index:6;background:#fff;flex:none;text-align:center;padding:13px 11px 7px;border:0;box-shadow:none;isolation:isolate}
.sticky-score::after{content:"";position:absolute;top:calc(100% - 1px);left:0;right:0;height:32px;background:linear-gradient(180deg,#fff 0%,#fffffff2 25%,#ffffffa8 57%,#ffffff00 100%);pointer-events:none;z-index:1}
.score-assembly{height:161px;position:relative;display:flex;justify-content:center;align-items:flex-start}
.score-trigger{position:relative;z-index:3;margin:0 auto;border:0;background:transparent;color:var(--ink);display:flex;flex-direction:column;align-items:center;gap:9px;padding:0;width:150px;min-width:0;cursor:pointer}
.score-trigger .large-ring{height:129px;width:129px;position:relative;display:grid;place-items:center;background:transparent;border-radius:50%;flex-shrink:0}
.score-trigger .large-ring::before{content:none}
.score-ring-piece{position:absolute;inset:0;border-radius:50%;background:conic-gradient(#0756bc calc(var(--pct)*1%),#dce9fa 0);-webkit-mask:radial-gradient(farthest-side,transparent calc(100% - 12px),#000 calc(100% - 11px));mask:radial-gradient(farthest-side,transparent calc(100% - 12px),#000 calc(100% - 11px));transition:transform .54s cubic-bezier(.2,.7,.2,1),opacity .38s ease}
.score-ring-piece.left-half{clip-path:inset(0 50% 0 0)}
.score-ring-piece.right-half{clip-path:inset(0 0 0 50%)}
.sticky-score.expanded .score-ring-piece.left-half{transform:translateX(-48px);opacity:.18}
.sticky-score.expanded .score-ring-piece.right-half{transform:translateX(48px);opacity:.18}
.score-trigger .large-ring-inner{position:relative;display:flex;flex-direction:column;align-items:center;transform:translateY(1px);transition:transform .4s ease}
.score-trigger .large-ring-inner b{font-size:42px;line-height:1;letter-spacing:-1.9px;font-weight:760;color:#092954}
.score-trigger .large-ring-inner small{font-size:11px;color:#6a7e9a;margin-top:3px}
.score-trigger .score-toggle-label{font-size:10px;font-weight:650;color:#607895;white-space:nowrap;position:relative;z-index:2}
.score-wings{position:absolute;z-index:4;top:8px;display:flex;flex-direction:column;gap:9px;width:101px;opacity:0;pointer-events:none;transition:opacity .3s ease .08s,transform .5s cubic-bezier(.22,.75,.28,1)}
.score-wings.left{left:0;transform:translateX(48px) scale(.76)}
.score-wings.right{right:0;transform:translateX(-48px) scale(.76)}
.sticky-score.expanded .score-wings{opacity:1;pointer-events:auto;transform:translateX(0) scale(1)}
.score-wing{border:0;background:#f0f5fc;padding:6px 7px;border-radius:12px;display:flex;align-items:center;justify-content:space-between;min-height:35px;color:#163c73;text-align:left;box-shadow:none;transition:background .16s ease,transform .16s ease}
.score-wing:hover{background:#e1edfc;transform:translateY(-1px)}
.score-wing span{font-size:9px;line-height:1.13;font-weight:680;max-width:64px}

.score-wing:focus-visible{outline:2px solid #0756bc;outline-offset:1px}
/* Bottom-to-top trail. The scroll container is initially parked near level 1. */
.journey-scroll{flex:1;min-height:0;overflow-y:auto;overflow-x:hidden;overscroll-behavior:contain;scrollbar-width:none;background:#fff;position:relative}
.journey-scroll::-webkit-scrollbar{display:none}
.journey-world{height:928px;position:relative;margin:0 auto;max-width:360px;min-width:0}

.journey-road path.road-shadow{fill:none;stroke:#dfebfa;stroke-width:23;stroke-linejoin:round;stroke-linecap:round}

/* ChatGPT-like composer without a visible container border or divider. */

function guideLesson(){const g=guideStages[st.guideLevel-1],answer=st.guideAnswers[g.n],answered=answer!==undefined,correct=answer===g.correct;return `<section class="phone-section">${header()}<div class="puls-main guide-lesson"><div class="guide-title-line"><span class="sectionlabel">WEALTH GUIDE · STUFE ${g.n} VON 5</span><span class="guide-course-chip">${st.guideDone[g.n]?'✓ Abgeschlossen':'◉ Lernstation'}</span></div><div class="guide-lesson-intro"><div class="guide-big-node">${st.guideDone[g.n]?'✓':g.n}</div><div><h2 class="pageh">${g.title}</h2><p class="lead">${g.sub}</p></div></div><div class="guide-pillars"><div><b>01 · Finanzbasis</b><p>${g.basis}</p></div><div><b>02 · Vermögen</b><p>${g.wealth}</p></div><div><b>03 · Absicherung</b><p>${g.protect}</p></div></div><div class="guide-quiz"><span class="sectionlabel">60-SEKUNDEN-WISSENSCHECK</span><h3>${g.quiz}</h3>${g.answers.map((a,i)=>`<button class="guide-answer ${answered&&answer===i?(correct?'correct':'incorrect'):''}" onclick="answerGuide(${i})" aria-pressed="${answer===i}"><span>${String.fromCharCode(65+i)}</span>${a}</button>`).join('')}${answered?`<div class="guide-feedback ${correct?'ok':'retry'}">${correct?'✓ Richtig. '+g.detail:'Noch nicht ganz. '+g.detail+' Versuche es erneut.'}</div>`:''}</div><div class="grow"></div>${correct?`<button class="primary" onclick="completeGuide()">Lernstation abschließen ✓</button>${g.n===2?`<button class="secondary" onclick="go('execution')">Notreserve in der Praxis angehen →</button>`:''}`:`<button class="secondary" onclick="go('guide')">Zum Lernpfad zurück</button>`}<div class="guide-quiet">${g.step} · Kein XP für Trades, keine Anlageempfehlung.</div></div></section>`}

function answerGuide(a){st.guideAnswers[st.guideLevel]=a;render()}
function completeGuide(){const g=st.guideLevel;if(st.guideAnswers[g]!==guideStages[g-1].correct){toast('Bitte schließe zuerst den Wissenscheck ab.');return}st.guideDone[g]=true;st.guideLevel=Math.min(5,g+1);st.page='guide';render();toast('Lernstation abgeschlossen. Dein PULS-Score bleibt unverändert.')}

function toggleScoreDetails(){
  if(st.detailMode)return; // Only the main score can reveal the six subratings.
  st.scoreExpanded=!st.scoreExpanded;
  const sticky=document.querySelector('.sticky-score');if(!sticky)return;
  sticky.classList.toggle('expanded',st.scoreExpanded);
  const trigger=sticky.querySelector('.score-trigger');if(trigger){trigger.setAttribute('aria-expanded',String(st.scoreExpanded));trigger.setAttribute('aria-label',`Score ${st.detailMode?(dimensions.find(d=>d.id===st.selected)||dimensions[0]).score:(st.verified?62:58)} von 100, sechs Unterbewertungen seitlich ${st.scoreExpanded?'schließen':'anzeigen'}`)}
  const label=sticky.querySelector('.score-toggle-label');if(label)label.textContent=(st.detailMode?(dimensions.find(d=>d.id===st.selected)||dimensions[0]).name:(st.scoreExpanded?'Teilbewertungen schließen':'Tippen für Teilbewertungen'))+' ↔';
  sticky.querySelectorAll('.score-wings').forEach(w=>w.setAttribute('aria-hidden',String(!st.scoreExpanded)));
  sticky.querySelectorAll('.score-wing').forEach(w=>w.tabIndex=st.scoreExpanded?0:-1);
}

 if(id==='life')return `<div class="insight-action-open"><p><b>Was möchtest du planen?</b></p><div class="insight-choices">${['Urlaub','Umzug','Gründung'].map(v=>`<button onclick="composeLife('${v}')">${v}</button>`).join('')}</div><p>Dein Entwurf erscheint unten im Eingabefeld. Du kannst ihn ändern, bevor du ihn absendest.</p></div>`;

 return `<div class="insight-action-open"><p><b>Wofür eignet sich eine Notreserve am ehesten?</b></p><div class="insight-answers">${['Kurzfristig verfügbar und risikoarm','Ausschließlich für riskante Anlagen'].map((v,i)=>`<button class="${st.learningChoice===i?'selected':''}" onclick="setLearning(${i})">${v}</button>`).join('')}</div>${st.learningChoice!==null?`<p class="${st.learningChoice===0?'insight-success':'insight-correction'}">${st.learningChoice===0?'✓ Richtig. Eine Reserve muss im Notfall erreichbar sein.':'Risikoanlagen können im falschen Moment an Wert verlieren.'}</p>`:''}${st.learningChoice===0&&!st.guideDone[2]?'<button class="insight-inline-button" onclick="completeInlineLearning()">Lernschritt abschließen</button>':st.guideDone[2]?'<p class="insight-success">✓ Diese Übung ist abgeschlossen.</p>':''}</div>`;
}
function dimension(){const d=dimensions.find(x=>x.id===st.selected)||dimensions[0],s=d.id==='fitness'&&st.verified?58:d.score;return `<section class="phone-section">${header()}<div class="puls-main"><div class="sectionlabel">PULS · Bereichsdiagnose</div><h2 class="pageh">${d.name}</h2><p class="lead">${d.full} · Dieser Teilwert ist eine exemplarische Modellbewertung.</p><div class="data-card tint" style="display:flex;align-items:center;gap:13px"><div class="scorecircle" style="--pct:${s};width:84px;height:84px"><div><b>${s}</b><small>von 100</small></div></div><div><div class="sectionlabel">Dein Bereichswert</div><div style="font-size:12px;font-weight:740;margin-top:5px">${s>=70?'Gut entwickelt':s>=55?'Im Aufbau':'Hier besteht Potenzial'}</div><div class="explain" style="margin-top:5px">Einfluss auf den PULS-Gesamtwert abhängig von Gewichtung und Lebensphase.</div></div></div><div class="data-card"><div class="sectionlabel">Was steckt dahinter?</div><p class="explain">${d.why}</p><div class="metric-line"><span>${d.signal}</span><b>${d.value}</b></div></div><div class="data-card tint"><div class="sectionlabel">Empfohlener nächster Schritt</div><p class="explain" style="margin-bottom:0">${d.tip}</p></div><div class="grow"></div><button class="primary" onclick="go('${d.id==='fitness'?'execution':'coach'}')">${d.id==='fitness'?'Konkreten Plan öffnen':'Mit dem Coach vertiefen'} →</button><button class="secondary" onclick="go('overview')">Zu allen Bereichen</button></div></section>`}
function execution(){const gap=1800, n=Math.ceil(gap/st.saving), stage=st.verified?3:st.rule?2:1;return `<section class="phone-section">${header()}<div class="puls-main"><div class="exec-top"><span class="sectionlabel">PULS · Umsetzung</span><span class="pill">Mission 01 · Resilienz</span></div><h2 class="pageh">Dein Notgroschen.</h2><p class="lead">Du hast Rücklagen für 2 Monate. Dein nächstes Ziel ist eine Reserve für 3 Monate notwendiger Ausgaben.</p><div class="mission-box"><div class="labelrow"><span class="mainlabel">3.600 €</span><span style="font-size:12px;font-weight:700">Ziel 5.400 €</span></div><div class="progressbar"><i></i></div><div class="contextline"><span>2,0 Monate vorhanden</span><span>1.800 € fehlen</span></div></div><div class="data-card"><div class="labelrow"><span class="mainlabel">Monatlich zurücklegen</span><span class="mainlabel">${euro(st.saving)}</span></div><input class="range" type="range" min="50" max="300" step="25" value="${st.saving}" oninput="setSaving(this.value)" aria-label="Monatliche Sparrate"/><div class="metric-bottom"><span>50 €</span><span>300 €</span></div><div class="metric-line"><span>Geschätzte Zeit zum Ziel</span><b>${n} Monate</b></div></div><div class="data-card tint"><div class="sectionlabel">Apply to Unlock · Nachgewiesener Fortschritt</div><div class="steps" style="margin-top:11px"><div class="stepbox done"><div class="tick">✓</div><small>Plan erstellt</small></div><div class="stepline"></div><div class="stepbox ${stage>=2?'done':''}"><div class="tick">${stage>=2?'✓':'2'}</div><small>Regel bestätigt</small></div><div class="stepline"></div><div class="stepbox ${stage>=3?'done':''}"><div class="tick">${stage>=3?'✓':'3'}</div><small>Verifiziert</small></div></div><p class="alert" style="margin:11px 0 0">${st.verified?'Simulation abgeschlossen: Regelmäßige Einzahlungen und 60 Tage gehaltene Reserve sind nachgewiesen. Score 58 → 62.':st.rule?'Die Regel ist für die Demo vorgemerkt. Noch keine Score-Punkte: Es fehlen reale Nachweise.':'Ein Vorschlag verändert den tatsächlichen Score nicht. Die Verbesserung muss erst nachgewiesen werden.'}</p></div><div class="grow"></div>${st.verified?`<button class="primary" onclick="go('overview')">Verifizierten Fortschritt ansehen →</button>`:st.rule?`<button class="primary" onclick="verify()">${n+2} Monate simulieren und prüfen →</button>`:`<button class="primary" onclick="activate()">Sparregel in Demo vormerken →</button>`}<button class="secondary" onclick="go('coach')">Frage zum Plan stellen</button></div></section>`}
const answers={reserve:'Du hast derzeit 3.600 € Reserve bei geschätzten notwendigen Ausgaben von 1.800 € im Monat. Das deckt 2 Monate. Für 3 Monate wären 5.400 € nötig. Der Coach erklärt den Rechenweg – nicht, ob du ein Finanzprodukt kaufen solltest.',move:'Für einen Umzug brauchst du neben laufenden Kosten meist einen einmaligen Puffer. Prüfe zuerst Kaution, Einrichtung und deine neue monatliche Belastung. Deine vorhandene Notreserve sollte nicht vollständig aufgebraucht werden.',score:'Dein synthetischer PULS-Score ergibt sich aus sechs gewichteten Bereichen. Eine Lernübung kann Wissen verbessern; eine belegte Verhaltensänderung wirkt erst bei nachgewiesener Umsetzung. Die Bewertung ist ein Prototyp, keine validierte individuelle Diagnose.'};
function coach(){return `<section class="phone-section">${header()}<div class="puls-main"><div class="sectionlabel">PULS · Wealth Coach</div><h2 class="pageh">Deine Pläne zählen.</h2><p class="lead">Kontodaten zeigen, was passiert ist. Du weißt, was als Nächstes kommt. Beides zusammen macht deine Planung besser.</p><button class="coach-question" onclick="go('goalInput')">✧ Ich plane etwas – Urlaub, Umzug, Gründung &nbsp;›</button><button class="coach-question" onclick="ask('reserve')">◎ Warum ist mein Notgroschen zu klein? &nbsp;›</button><button class="coach-question" onclick="ask('score')">◉ Wie berechnet sich mein PULS Score? &nbsp;›</button>${st.question?`<div class="coach-answer"><b style="display:block;margin-bottom:6px">PULS Antwort</b>${answers[st.question]}</div>`:`<div class="data-card tint"><p class="explain" style="margin:0">Pläne werden nur mit deiner Bestätigung gespeichert. Sie verändern den gemessenen Score nicht automatisch.</p></div>`}<div class="grow"></div><div class="advisor">◈ &nbsp;<b>Wenn es komplex wird:</b> Nach deiner Freigabe kann ein Berater die relevanten Fragen und Daten erhalten.</div><button class="secondary" onclick="toast('Demo: Keine echte Beratungsanfrage erstellt.')">Beratungsgespräch anfragen ↗</button><div class="alert">Regelbasierte Demo ohne Live-KI. Keine Anlageberatung.</div></div></section>`}
function esc(t){return String(t).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
const examples={Urlaub:'I am planning a €1,500 vacation in March.',Umzug:'I want to move in May and expect costs of €2,400.',Gründung:'I plan to start a business and need about €4,000 in startup capital.'};
function goalInput(){return `<section class="phone-section">${header()}<div class="puls-main"><span class="sectionlabel">PULS · Deine Perspektive</span><h2 class="pageh">Was steht bei dir an?</h2><p class="lead">Wir kennen deine Zahlen. Erzähl uns, was du vorhast – auch wenn es noch nicht in deinen Kontodaten steht.</p><div class="goal-chips">${['Urlaub','Umzug','Gründung'].map(x=>`<button type="button" class="${st.draftType===x?'sel':''}" onclick="goalExample('${x}')">${x==='Urlaub'?'☼':x==='Umzug'?'⌂':'✦'} ${x}</button>`).join('')}</div><label class="sectionlabel" for="goalText">Dein Vorhaben in deinen Worten</label><textarea id="goalText" class="goal-input" maxlength="240" oninput="st.draftText=this.value" aria-label="Vorhaben beschreiben" placeholder="Zum Beispiel: Ich plane einen Urlaub im März für 1.500 €">${esc(st.draftText)}</textarea><div class="data-card tint"><span class="sectionlabel">So funktioniert es</span><p class="explain" style="margin:7px 0 0">PULS erkennt im Konzeptdemo-Text ein mögliches Ziel und fragt dich anschließend nach Kosten und Zeitraum. <b>Nichts wird ohne Bestätigung übernommen.</b></p></div><div class="grow"></div><button class="primary" onclick="interpretGoal()">Plan unverbindlich auswerten →</button><button class="secondary" onclick="back()">Abbrechen</button><div class="goal-info">Demo ohne externes KI-Modell. Nur lokale Texteingabe, keine Bankdatenübertragung.</div></div></section>`}
function guessMonth(s){const m=String(s).toLowerCase();for(const [key,name] of [['januar','Januar'],['februar','Februar'],['märz','März'],['maerz','März'],['april','April'],['mai','Mai'],['juni','Juni'],['juli','Juli'],['august','August'],['september','September'],['oktober','Oktober'],['november','November'],['dezember','Dezember']]){if(m.includes(key)||m.includes(({Januar:'january',Februar:'february',März:'march',April:'april',Mai:'may',Juni:'june',Juli:'july',August:'august',September:'september',Oktober:'october',November:'november',Dezember:'december'})[name]))return name+' '+(['Januar','Februar','März','April','Mai','Juni','Juli','August','September','Oktober','November','Dezember'].indexOf(name)<=10?'2027':'2026')}return 'März 2027'}
function goalExample(type){st.draftType=type;st.draftText=examples[type];st.draftAmount=type==='Urlaub'?1500:type==='Umzug'?2400:4000;st.draftMonth=type==='Urlaub'?'März 2027':type==='Umzug'?'Mai 2027':'Juni 2027';render()}
function interpretGoal(){const t=st.draftText.trim();if(t.length<8){toast('Bitte beschreibe kurz, was du planst.');return}const a=t.match(/(\d+(?:[.]\d{3})*(?:,\d{1,2})?)\s*(?:€|Euro)/i);if(a){const num=Number(a[1].replace(/\./g,'').replace(',','.'));if(Number.isFinite(num)&&num>0)st.draftAmount=num}st.draftType=/urlaub|reise|ferien|vacation|holiday|travel|trip/i.test(t)?'Urlaub':/umzieh|wohnung|miete|moving|move|rent/i.test(t)?'Umzug':/gründ|selbstständ|startup|business|self.employed/i.test(t)?'Gründung':'Persönliches Ziel';st.draftMonth=guessMonth(t);go('goalConfirm')}
function goalConfirm(){return `<section class="phone-section">${header()}<div class="puls-main"><span class="sectionlabel">PULS · Bitte bestätigen</span><h2 class="pageh">Habe ich dich richtig verstanden?</h2><p class="lead">Aus deinem Text wurde ein möglicher Plan abgeleitet. Du kannst alle Angaben korrigieren.</p><div class="data-card tint"><span class="sectionlabel">Erkanntes Vorhaben</span><h2 class="pageh" style="margin-top:8px">${esc(st.draftType)}</h2><p class="explain">${esc(st.draftText)}</p></div><div class="goal-fields"><label>Budget (€)<input aria-label="Budget in Euro" type="number" min="1" max="1000000" value="${st.draftAmount}" oninput="setDraftAmount(this.value)"/></label><label>Zielmonat<select aria-label="Zielmonat" onchange="st.draftMonth=this.value">${['Dezember 2026','Januar 2027','Februar 2027','März 2027','April 2027','Mai 2027','Juni 2027','Juli 2027','August 2027','September 2027','Oktober 2027','November 2027'].map(x=>`<option ${x===st.draftMonth?'selected':''}>${x}</option>`).join('')}</select></label></div><div class="data-card"><span class="sectionlabel">Was PULS damit macht</span><p class="explain" style="margin-bottom:0">Wir betrachten deine finanzielle Belastbarkeit und berechnen eine mögliche monatliche Zielrate. Keine automatische Überweisung, kein Einfluss auf deinen gemessenen Score.</p></div><div class="grow"></div><button class="primary" onclick="confirmGoal()">Vorhaben bestätigen und prüfen →</button><button class="secondary" onclick="back()">Angaben bearbeiten</button></div></section>`}
function monthsToTarget(m){const names=['Januar','Februar','März','April','Mai','Juni','Juli','August','September','Oktober','November','Dezember'];const english=['January','February','March','April','May','June','July','August','September','October','November','December'];const a=m.split(' '),i=Math.max(names.indexOf(a[0]),english.indexOf(a[0])),y=Number(a[1]);return i<0||!Number.isFinite(y)?4:Math.max(1,(y-2026)*12+i-10)}
function setDraftAmount(v){st.draftAmount=Math.min(1e6,Math.max(0,Number(v)||0))}
function confirmGoal(){if(st.draftAmount<=0){toast('Bitte gib ein realistisches Budget ein.');return}st.goal={type:st.draftType,description:st.draftText,amount:st.draftAmount,month:st.draftMonth};st.goalSaved=false;go('goalResult')}
function goalResult(){const g=st.goal;if(!g)return goalInput();const n=monthsToTarget(g.month),monthly=Math.ceil(g.amount/n),newRes=Math.max(0,3600-g.amount),coverage=(newRes/1800).toFixed(1).replace('.',',');return `<section class="phone-section">${header()}<div class="puls-main goal-result"><span class="sectionlabel">PULS · Deine Planung</span><h2 class="pageh">${esc(g.type)} – ohne böse Überraschung.</h2><p class="lead">Dein Ziel gehört zu deiner persönlichen Planung, nicht automatisch in die Bewertung deiner finanziellen Gesundheit.</p><div class="goal-highlight"><span class="sectionlabel">Geplantes Budget</span><div><b>${euro(g.amount)}</b> <span class="pill">${esc(g.month)}</span></div><p>Mit ${n} Monaten Vorlauf wären rund <b>${euro(monthly)} pro Monat</b> in einem separaten Spartopf nötig.</p></div><div class="data-card"><span class="sectionlabel">Was passiert mit deiner Reserve?</span><div class="choice-line"><span>Aktuelle Notreserve</span><b>3.600 €</b></div><div class="choice-line"><span>Reserve bei Zahlung daraus</span><b>${euro(newRes)}</b></div><div class="choice-line"><span>Verbleibende Deckung</span><b>${coverage} Monate</b></div></div><div class="data-card tint"><span class="sectionlabel">Empfehlung</span><p class="explain" style="margin-bottom:0">Plane die ${euro(g.amount)} möglichst getrennt von der Notreserve. Prüfe, ob ${euro(monthly)} monatlich zusätzlich zu laufenden Ausgaben und Rücklagenaufbau realistisch sind.</p></div><div class="grow"></div><button class="primary" onclick="saveGoal()">${st.goalSaved?'Plan ist vorgemerkt ✓':'Als persönlichen Plan vormerken'} →</button><button class="secondary" onclick="go('goalInput')">Plan ändern</button><div class="goal-info">Simulation mit Demo-Daten. Keine Überweisung und keine automatische finanzielle Entscheidung.</div></div></section>`}
function saveGoal(){st.goalSaved=true;pageHistory.length=0;st.page='overview';st.detailMode=false;render();toast('Persönliches Vorhaben vorgemerkt – unverbindlich.')} 
function go(p){if(p!==st.page){pageHistory.push(st.page);st.page=p;}render()}function back(){if(st.page==='overview'&&st.detailMode){st.detailMode=false;st.actionExpanded=false;st.reasonExpanded=false;st.insightPosition=0;st.scoreExpanded=true;render();return}st.page=pageHistory.pop()||'home';render()}function selectDim(id){st.selected=id;st.detailMode=true;st.scoreExpanded=false;st.actionExpanded=false;st.reasonExpanded=false;st.insightPosition=0;render()}function setSaving(val){st.saving=Number(val);render()}function ask(q){st.question=q;render()}function activate(){st.rule=true;render();toast('Sparregel vorgemerkt – keine reale Kontobewegung.')}function verify(){if(!st.rule)return;st.verified=true;render();toast('Synthetische Einzahlungen und Halteperiode erfolgreich geprüft.')}function toast(s){const e=$('#toast');e.textContent=s;e.style.display='block';clearTimeout(window.__toastTimer);window.__toastTimer=setTimeout(()=>e.style.display='none',2700)}
function render(){document.body.dataset.view=st.page;const phone=$('#phone');phone.classList.toggle('calm',cfg.style==='calm');$('#screen').innerHTML=({home,overview,dimension,execution,coach,goalInput,goalConfirm,goalResult,guide,guideLesson})[st.page]();if(st.page==='overview'){const j=document.querySelector('.journey-scroll');if(j){j.scrollTop=st.journeyPosition===null?j.scrollHeight-j.clientHeight:st.journeyPosition;}}document.querySelectorAll('#size-choice button').forEach(b=>b.classList.toggle('sel',b.dataset.size===cfg.size));document.querySelectorAll('#style-choice button').forEach(b=>b.classList.toggle('sel',b.dataset.style===cfg.style));document.querySelectorAll('#start-choice button').forEach(b=>b.classList.toggle('sel',b.dataset.start===(st.page==='home'?'home':'overview')));document.querySelectorAll('[data-web-page]').forEach(b=>{const active=b.dataset.webPage===st.page||(b.dataset.webPage==='overview'&&['guide','guideLesson','dimension','execution'].includes(st.page));b.classList.toggle('active',active);if(active)b.setAttribute('aria-current','page');else b.removeAttribute('aria-current');})}
document.querySelectorAll('#size-choice button').forEach(b=>b.onclick=()=>{cfg.size=b.dataset.size;render()});document.querySelectorAll('#style-choice button').forEach(b=>b.onclick=()=>{cfg.style=b.dataset.style;render()});document.querySelectorAll('#start-choice button').forEach(b=>b.onclick=()=>{pageHistory.length=0;st.page=b.dataset.start;st.detailMode=false;st.scoreExpanded=false;st.actionExpanded=false;render()});document.createElement('button').onclick=()=>{cfg.trend=!cfg.trend;render()};document.createElement('button').onclick=()=>{cfg.score=!cfg.score;render()};document.addEventListener('keydown',e=>{if(e.key==='Escape'&&st.page!=='home')back()});document.createElement('button').onclick=()=>{pageHistory.length=0;st.page='home';st.selected='fitness';st.saving=150;st.rule=false;st.verified=false;st.question=null;st.goal=null;st.goalSaved=false;st.scoreExpanded=false;st.detailMode=false;st.actionExpanded=false;st.reasonExpanded=false;st.insightPosition=0;st.composerText='';st.behaviorAmount=100;st.behaviorSet=false;st.protectionChoice=null;st.knowledgeChoice=null;st.learningChoice=null;st.journeyPosition=null;st.draftText=examples.Urlaub;st.draftType='Urlaub';st.draftAmount=1500;st.draftMonth='März 2027';st.guideLevel=2;st.guideAnswers={};st.guideDone={1:true};cfg.size='regular';cfg.style='smooth';cfg.trend=true;cfg.score=true;render()};render();

const PULS_EN_MONTHS = {Januar:'January',Februar:'February','März':'March',April:'April',Mai:'May',Juni:'June',Juli:'July',August:'August',September:'September',Oktober:'October',November:'November',Dezember:'December'};
function pulsEnglish(s){
  const lead=s.match(/^\s*/)[0],end=s.match(/\s*$/)[0],body=s.trim();
  if(!body) return s;
  let t=PULS_EN_MAP[body];
  if(t===undefined){
    t=body;
    t=t.replace(/^(\d+) Monate$/,(_,n)=>n+' months');
    t=t.replace(/^(\d+) von (\d+) Monaten$/,(_,a,b)=>a+' of '+b+' months');
    t=t.replace(/^(\d+) von (\d+)$/,(_,a,b)=>a+' of '+b);
    t=t.replace(/^(\d+) von (\d+) Aufgaben$/,(_,a,b)=>a+' of '+b+' exercises');
    t=t.replace(/^(\d+) von (\d+) Modulen$/,(_,a,b)=>a+' of '+b+' modules');
    t=t.replace(/^(\d+) von (\d+) Fragen$/,(_,a,b)=>a+' of '+b+' questions');
    t=t.replace(/^(\d+(?:[,.]\d+)?) von (\d+(?:[,.]\d+)?) Monaten$/,(_,a,b)=>a.replace(',','.')+' of '+b.replace(',','.')+' months');
    t=t.replace(/^(\d+(?:[,.]\d+)?) Monate$/,(_,n)=>n.replace(',','.')+' months');
    t=t.replace(/^(.+?): (\d+) von 100 Punkten$/,(_,a,n)=>(PULS_EN_MAP[a]||a)+': '+n+' out of 100 points');
    t=t.replace(/^(.+?): (\d+) von 100$/,(_,a,n)=>(PULS_EN_MAP[a]||a)+': '+n+' out of 100');
    t=t.replace(/^Level (\d+): (.*)$/,(_,n,a)=>'Level '+n+': '+(PULS_EN_MAP[a]||a));
    t=t.replace(/^Stufe (\d+): (.*)$/,(_,n,a)=>'Stage '+n+': '+(PULS_EN_MAP[a]||a));
    t=t.replace(/^WEALTH GUIDE · STUFE (\d+) VON 5$/,(_,n)=>'WEALTH GUIDE · STAGE '+n+' OF 5');
    t=t.replace(/^(.+) – ohne böse Überraschung\.$/,(_,a)=>(PULS_EN_MAP[a]||a)+' — without unexpected costs.');
    for(const [de,en] of Object.entries(PULS_EN_MONTHS))t=t.replace(new RegExp('\\b'+de+'(?= \\d{4})','g'),en);
    t=t.replace(/^Angabe erfasst: (.*)\. Für eine verlässliche Prüfung werden Vertragsinformationen benötigt\. Der Score bleibt vorläufig\.$/,(_,v)=>'Response recorded: '+(PULS_EN_MAP[v]||v)+'. Policy details are needed for a reliable assessment. The score remains provisional.');
    t=t.replace(/^Mit (\d+) Monaten Vorlauf wären rund$/,(_,n)=>'With '+n+' months to prepare, you would need about');
    t=t.replace(/^([\d.,\s]+) € pro Monat$/,(_,n)=>'€'+n.trim()+' per month');
    t=t.replace(/^([€\d.,\s\u00a0]+) pro Monat$/,(_,n)=>n.trim()+' per month');
    t=t.replace(/^(\d{1,3}(?:\.\d{3})*(?:,\d+)?)\s?€$/,(_,n)=>'€'+n.replace(/\./g,',').replace(',','.'));
    t=t.replace(/^Plane die (.+) möglichst getrennt von der Notreserve\. Prüfe, ob (.+) monatlich zusätzlich zu laufenden Ausgaben und Rücklagenaufbau realistisch sind\.$/,(_,a,b)=>'Try to save '+a+' separately from your emergency fund. Check whether '+b+' per month is affordable alongside your regular expenses and other savings goals.');
    t=t.replace(/^(.+?) · Kein XP für Trades, keine Anlageempfehlung\.$/,(_,a)=>(PULS_EN_MAP[a]||a)+' · No XP for trading; not investment advice.');
    t=t.replace(/^(.+?) von 100, sechs Unterbewertungen seitlich (anzeigen|schließen)$/,(_,a,mode)=>(PULS_EN_MAP[a]||a)+' out of 100; '+(mode==='anzeigen'?'show':'hide')+' six side sub-scores');
    t=t.replace(/^(\d+) Monate simulieren und prüfen →$/,(_,n)=>'Simulate and verify '+n+' months →');
    t=t.replace(/^([+−-]?[\d.,]+) diese Woche( ↗)?$/,(_,n,arrow)=>n.replace(',','.')+' this week'+(arrow||''));
  }
  return lead+t+end;
}
let pulsTranslating=false;
function pulsTranslateDocument(){
  if(pulsTranslating)return;
  pulsTranslating=true;
  const root=document.querySelector('.appframe');
  if(root){
    // Preserve the original internal month value even though option labels are localized.
    root.querySelectorAll('option').forEach(o=>{if(!o.hasAttribute('value'))o.value=o.textContent.trim()});
    const walk=document.createTreeWalker(root,NodeFilter.SHOW_TEXT);
    const nodes=[];while(walk.nextNode()){const n=walk.currentNode;if(n.parentElement&&!['SCRIPT','STYLE'].includes(n.parentElement.tagName))nodes.push(n)}
    nodes.forEach(n=>{const next=pulsEnglish(n.textContent);if(next!==n.textContent)n.textContent=next});
    root.querySelectorAll('[aria-label],[title],[placeholder]').forEach(el=>{
      for(const attr of ['aria-label','title','placeholder'])if(el.hasAttribute(attr)){
        const old=el.getAttribute(attr),next=pulsEnglish(old);if(next!==old)el.setAttribute(attr,next)
      }
    });
  }
  pulsTranslating=false;
}
const pulsEnObserver=new MutationObserver(()=>{
  pulsEnObserver.disconnect();pulsTranslateDocument();pulsEnObserver.observe(document.body,{subtree:true,childList:true,characterData:true,attributes:true,attributeFilter:['title','placeholder','aria-label']});
});
pulsTranslateDocument();
pulsEnObserver.observe(document.body,{subtree:true,childList:true,characterData:true,attributes:true,attributeFilter:['title','placeholder','aria-label']});
</script></body></html>
